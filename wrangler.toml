name = "buysell-best"
compatibility_date = "2026-09-20"
main = "./worker.js"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/", "/*.html", "/about", "/about/", "/ad", "/ad/", "/categories", "/categories/", "/contact", "/contact/", "/post-ad", "/post-ad/", "/privacy", "/privacy/", "/search", "/search/", "/terms", "/terms/", "/deals", "/deals/", "/index", "/index/", "/index.html", "/api/*", "/products", "/products/*", "/guides", "/guides/*", "/shopping-methodology", "/shopping-methodology/*", "/hotels", "/hotels/*", "/promo-codes", "/promo-codes/*", "/insights", "/insights/*", "/careers", "/careers/*", "/sitemap.xml", "/image-sitemap.xml", "/sitemap-index.xml", "/sitemaps/*", "/flash-sale", "/flash-sale/*", "/flash-media/*"]

[[d1_databases]]
binding = "DB"
database_name = "buysell-best-db"
database_id = "822532f2-1e71-41c5-8d3b-0b678c903e0a"

[triggers]
# Temporarily paused on owner request 2026-10-23. Resume only on explicit authorization.
crons = []

[[r2_buckets]]
binding = "FLASH_MEDIA"
bucket_name = "buysell-flash-media"

# One-shot Cloudflare API-triggered workflow. No schedules and no public handler.
[[workflows]]
name = "buysell-admitad-manual"
binding = "ADMITAD_IMPORT"
class_name = "ManualAdmitadImport"
