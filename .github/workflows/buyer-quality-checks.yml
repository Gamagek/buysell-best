name: Buyer Guide Quality Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  content-and-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate content, Cloudflare Worker and integration tests
        run: npm test
